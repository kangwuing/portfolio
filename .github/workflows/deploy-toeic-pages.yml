name: Deploy Portfolio and TOEIC Lab to Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "styles.css"
      - "CV.pdf"
      - "toeic-study/**"
      - ".github/workflows/deploy-toeic-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio and study app
        run: |
          mkdir -p _site
          cp index.html app.js style.css styles.css CV.pdf _site/
          cp -R toeic-study _site/toeic-study
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
