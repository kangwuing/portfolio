name: Deploy Portfolio and TOEIC Lab to Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "certifications.js"
      - "publications.js"
      - "certificates/**"
      - "data/certifications.json"
      - "data/publications.json"
      - "scripts/sync_google_scholar.py"
      - "style.css"
      - "styles.css"
      - "CV.pdf"
      - "toeic-study/**"
      - ".github/workflows/deploy-toeic-pages.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh publications from Google Scholar
        shell: bash
        run: |
          if ! python3 scripts/sync_google_scholar.py --output data/publications.json; then
            echo "::warning::Google Scholar sync failed; deploying the last verified publication data."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio and study app
        run: |
          mkdir -p _site
          cp index.html app.js certifications.js publications.js style.css styles.css CV.pdf _site/
          cp -R certificates _site/certificates
          cp -R data _site/data
          cp -R toeic-study _site/toeic-study
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
